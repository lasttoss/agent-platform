# dsh as a client of this platform. Everything provider-specific comes from the environment,
# because a harness that hardcodes one vendor is a harness you have to patch again next month:
#
#   OPENAI_BASE_URL   an OpenAI-compatible endpoint. Point it at the platform's own gateway
#                     (http://127.0.0.1:8090/v1) and the provider key never leaves the server;
#                     point it at a provider and every person needs their own provider account.
#   OPENAI_API_KEY    the key for that endpoint (never in this file). Against the gateway this is
#                     the same platform token as PLATFORM_TOKEN: one credential, two doors.
#   OPENAI_MODEL      a model id that endpoint serves
#   PLATFORM_TOKEN    a token from config/dsh-tokens.json (the KEY, not the user id it maps to)
#
# The shipped default route is `deepseek-official`, which speaks the DeepSeek wire format and does
# not fit an OpenAI-shaped endpoint; pi-ai is the adapter that turns "another endpoint" into
# configuration instead of a code change.
- insert:
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          openai-compatible:
            displayName: OpenAI-compatible
            apiKeyEnv: OPENAI_API_KEY
            api: openai-completions
            baseURL: !!js 'process.env.OPENAI_BASE_URL || "https://api.openai.com/v1"'
            models:
              - id: !!js 'process.env.OPENAI_MODEL || "gpt-4.1-mini"'
                name: Configured model
                contextWindow: 128000
                maxTokens: 8192

- id: llm-deepseek
  disabled: true

- id: agent-default-model
  config:
    provider: openai-compatible
    model: !!js 'process.env.OPENAI_MODEL || "gpt-4.1-mini"'

- insert:
    - id: mcp-platform
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: platform
        transport: streamable-http
        url: !!js 'process.env.PLATFORM_URL || "http://127.0.0.1:8090/mcp"'
        headers:
          Authorization: !!js '`Bearer ${process.env.PLATFORM_TOKEN}`'
        failOnStartupError: true
