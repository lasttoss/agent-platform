name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Python extras
        run: python3 -m pip install --quiet -r services/ocr/requirements.txt

      # No apt here on purpose. poppler is the fast local path; on runners the Ubuntu mirror
      # has been unreachable (DNS inside the runner network) and `apt-get update` then hangs
      # for minutes before failing. The pypdf fallback covers the same behaviour, and the
      # tests assert extracted text, never which engine produced it.
      - name: Which PDF engine is available
        run: |
          if command -v pdftotext >/dev/null 2>&1; then pdftotext -v 2>&1 | head -1;
          else echo "poppler absent — the pypdf fallback will be used"; fi

      - name: Generate OCR fixtures (synthetic, never committed)
        run: python3 services/ocr/samples/make_samples.py

      - name: Tests (python + go)
        run: make test 2>&1 | tee -a /tmp/ci.log

      - name: Parity — the same policy, two implementations
        run: make parity 2>&1 | tee -a /tmp/ci.log

      # When a red run cannot be read from the UI, publish the log where a developer can fetch
      # it with git. Deliberately on a throwaway branch, never on main.
      - name: Publish the log on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "ci@example.invalid"
          git config user.name "ci"
          mkdir -p ci-logs
          cp /tmp/ci.log "ci-logs/${GITHUB_SHA:0:7}.log" 2>/dev/null || echo "no log captured" > "ci-logs/${GITHUB_SHA:0:7}.log"
          git checkout -B ci-logs
          git add ci-logs
          git commit -m "ci log for ${GITHUB_SHA:0:7}" || true
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

  # The console is a second build system in the same repository, so it gets its own job: a
  # broken TypeScript build must fail the pull request, not the first deploy.
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/console/package-lock.json

      - name: Install
        working-directory: services/console
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        working-directory: services/console
        run: npm run build

      - name: The compose file still parses
        run: docker compose -f deploy/compose/docker-compose.yml config -q

  # The UI test runs against the container stack, not a mock: nginx, the gateway, the role store
  # and the MCP front all have to agree for it to pass. It is slower than the unit jobs, and that
  # is the point.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the platform
        run: docker compose -f deploy/compose/docker-compose.yml up -d --build

      - name: Wait for the console
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8088/health && break
            sleep 3
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/console/package-lock.json

      - name: Install
        working-directory: services/console
        run: npm ci --no-audit --no-fund

      - name: Browser
        working-directory: services/console
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        working-directory: services/console
        run: npx playwright test

      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --tail 80

      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v
