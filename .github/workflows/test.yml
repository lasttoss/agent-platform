name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python extras
        run: python3 -m pip install --quiet -r services/ocr/requirements.txt

      # poppler is the fast path for PDF text. Runners occasionally cannot reach the Ubuntu
      # mirror (DNS failure inside the runner network), so this step is best effort: the
      # pypdf fallback in engines/pdf.py covers the same behaviour and the tests assert
      # extracted text, never which engine produced it.
      - name: Fast path for PDF text (best effort)
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=3 >/dev/null 2>&1 || true
            sudo apt-get install -y poppler-utils || echo "::warning::poppler unavailable — tests will use the pypdf fallback"
          fi
          command -v pdftotext || echo "pdftotext: absent (fallback in use)"

      - name: Generate OCR fixtures (synthetic, never committed)
        run: python3 services/ocr/samples/make_samples.py

      - name: Tests
        run: make test
