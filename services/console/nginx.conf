server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The UI is a single page: unknown paths are its own routes, not 404s.
    location / {
        try_files $uri /index.html;
    }

    # Same origin as the page, so the token stays in one tab and no CORS rule exists to relax.
    location ~ ^/(admin|stats|health|v1|mcp) {
        proxy_pass http://gateway:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # MCP answers as a single event-stream frame when asked; buffering it would hide that.
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
}
