# Demo overlay: dsh is the MCP client, the platform gateway is the only door.
# pi-ai is the generic adapter, so an OpenAI-compatible endpoint is configuration.
- insert:
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          commandcode:
            displayName: CommandCode
            apiKeyEnv: COMMANDCODE_KEY
            api: openai-completions
            baseURL: https://api.commandcode.ai/provider/v1
            models:
              - id: deepseek/deepseek-v4.1-flash
                name: DeepSeek V4.1 Flash
                contextWindow: 720000
                maxTokens: 8192

- id: llm-deepseek
  disabled: true

- id: agent-default-model
  config:
    provider: commandcode
    model: deepseek/deepseek-v4.1-flash

- insert:
    - id: mcp-platform
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: platform
        transport: streamable-http
        url: http://127.0.0.1:8090/mcp
        headers:
          Authorization: !!js '`Bearer ${process.env.PLATFORM_TOKEN}`'
        failOnStartupError: true
