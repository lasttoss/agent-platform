<style>
  :root{
    --paper:#f5f5f5; --paper-2:#ececec;
    --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399;
    --rule:rgba(45,49,66,0.12); --rule-solid:#bfc0c0;
    --accent:#eb6c36; --accent-tint:rgba(235,108,54,0.08); --link:#2e5aa8;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:34px 30px 38px;background:var(--paper);color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:13px;line-height:1.5}
  .wrap{max-width:1340px;margin:0 auto}
  h1{font-size:21px;font-weight:600;letter-spacing:-0.01em;margin:0 0 4px}
  .lead{color:var(--muted);font-size:13px;margin:0 0 20px;max-width:88ch}
  .canvas{background:var(--paper-2);border:1px solid var(--rule);border-radius:4px;
    padding:10px 12px 6px;overflow:auto}
  svg{display:block;width:100%;height:auto;min-width:1000px}
  .n{fill:var(--paper);stroke:var(--rule-solid);stroke-width:1}
  .nf{fill:var(--paper);stroke:var(--muted);stroke-width:1}
  .focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.6}
  .grp{fill:none;stroke:var(--rule-solid);stroke-width:1;stroke-dasharray:4 4}
  .t{font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--ink)}
  .name{font-size:13px;font-weight:600}
  .sub{font-size:10.5px;fill:var(--muted)}
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;fill:var(--soft);letter-spacing:.04em}
  .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;fill:var(--soft);letter-spacing:.16em}
  .al{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8.5px;fill:var(--muted)}
  .arw{stroke:var(--muted);stroke-width:1.4;fill:none}
  .arw-link{stroke:var(--link);stroke-width:1.4;fill:none}
  .arw-dash{stroke:var(--soft);stroke-width:1.2;fill:none;stroke-dasharray:5 4}
  figcaption{margin:16px auto 0;max-width:88ch;font-size:13px;color:var(--muted);line-height:1.55}
  figcaption b{color:var(--ink);font-weight:600}
</style>

<body>
<main class="wrap">
  <h1>A chat gateway is where authority lives</h1>
  <p class="lead">One request, ten decisions, and only one component allowed to make them. Each stage below can refuse; none of them can grant what the stage above it denied.</p>

  <figure class="canvas">
    <svg viewBox="0 0 1280 792" role="img" aria-labelledby="fTitle fDesc"
         xmlns="http://www.w3.org/2000/svg">
      <title id="fTitle">agent-platform: gateway topology</title>
      <desc id="fDesc">A request enters the Go gateway: identity from transport, tool existence, argument validation, rate limit, daily quota, job slot, exact cache, single-flight coalescing, one upstream MCP call, then audit and answer. A parallel column lists the seven visibility gates and their reason codes; a third column shows the OpenAI-shaped door and the fail-closed rule.</desc>

      <defs>
        <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d75"/></marker>
        <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e5aa8"/></marker>
        <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a8399"/></marker>
      </defs>
      <text class="t m" x="20" y="74" text-anchor="start">THE REQUEST PATH — /mcp, in the order the code runs it</text>
      <circle cx="33" cy="110" r="11" fill="#2d3142"/>
      <text class="t" x="33" y="114" text-anchor="middle" font-size="10" fill="#f5f5f5">1</text>
      <rect class="n" x="54" y="92" width="436" height="56" rx="4"/>
      <text class="t name" x="66" y="111" text-anchor="start">identity from the transport</text>
      <text class="t sub" x="66" y="125.0" text-anchor="start">Bearer or X-DSH-Token → user. A body user id is</text>
      <text class="t sub" x="66" y="136.6" text-anchor="start">ignored: a caller that names itself can name</text>
      <text class="t sub" x="66" y="148.2" text-anchor="start">anyone.</text>
      <text class="t al" x="480" y="112" text-anchor="end">401</text>
      <path class="arw" d="M33 121 V154"/>
      <circle cx="33" cy="176" r="11" fill="#2d3142"/>
      <text class="t" x="33" y="180" text-anchor="middle" font-size="10" fill="#f5f5f5">2</text>
      <rect class="n" x="54" y="158" width="436" height="56" rx="4"/>
      <text class="t name" x="66" y="177" text-anchor="start">the tool is known</text>
      <text class="t sub" x="66" y="191.0" text-anchor="start">advertised by a running service at boot, described</text>
      <text class="t sub" x="66" y="202.6" text-anchor="start">in tools.json</text>
      <text class="t al" x="480" y="178" text-anchor="end">404</text>
      <path class="arw" d="M33 187 V220"/>
      <circle cx="33" cy="242" r="11" fill="#2d3142"/>
      <text class="t" x="33" y="246" text-anchor="middle" font-size="10" fill="#f5f5f5">3</text>
      <rect class="n" x="54" y="224" width="436" height="56" rx="4"/>
      <text class="t name" x="66" y="243" text-anchor="start">arguments are valid</text>
      <text class="t sub" x="66" y="257.0" text-anchor="start">checked before quota, cache and slot: an invalid</text>
      <text class="t sub" x="66" y="268.6" text-anchor="start">call must not spend anything</text>
      <text class="t al" x="480" y="244" text-anchor="end">invalid_args</text>
      <path class="arw" d="M33 253 V286"/>
      <circle cx="33" cy="308" r="11" fill="#2d3142"/>
      <text class="t" x="33" y="312" text-anchor="middle" font-size="10" fill="#f5f5f5">4</text>
      <rect class="n" x="54" y="290" width="436" height="56" rx="4"/>
      <text class="t name" x="66" y="309" text-anchor="start">rate limit</text>
      <text class="t sub" x="66" y="323.0" text-anchor="start">per user, per minute, with a burst — the smallest</text>
      <text class="t sub" x="66" y="334.6" text-anchor="start">unit a person reasons about</text>
      <text class="t al" x="480" y="310" text-anchor="end">-32006</text>
      <path class="arw" d="M33 319 V352"/>
      <circle cx="33" cy="374" r="11" fill="#2d3142"/>
      <text class="t" x="33" y="378" text-anchor="middle" font-size="10" fill="#f5f5f5">5</text>
      <rect class="n" x="54" y="356" width="436" height="56" rx="4"/>
      <text class="t name" x="66" y="375" text-anchor="start">daily quota</text>
      <text class="t sub" x="66" y="389.0" text-anchor="start">requests and tokens, the same counter /v1/respond</text>
      <text class="t sub" x="66" y="400.6" text-anchor="start">uses. 4 bytes ≈ 1 token is an estimate</text>
      <text class="t al" x="480" y="376" text-anchor="end">-32004</text>
      <path class="arw" d="M33 385 V418"/>
      <circle cx="33" cy="440" r="11" fill="#2d3142"/>
      <text class="t" x="33" y="444" text-anchor="middle" font-size="10" fill="#f5f5f5">6</text>
      <rect class="n" x="54" y="422" width="436" height="56" rx="4"/>
      <text class="t name" x="66" y="441" text-anchor="start">a job slot</text>
      <text class="t sub" x="66" y="455.0" text-anchor="start">long_running refuses when full instead of</text>
      <text class="t sub" x="66" y="466.6" text-anchor="start">accepting work it cannot start</text>
      <text class="t al" x="480" y="442" text-anchor="end">-32005</text>
      <path class="arw" d="M33 451 V484"/>
      <circle cx="33" cy="506" r="11" fill="#2d3142"/>
      <text class="t" x="33" y="510" text-anchor="middle" font-size="10" fill="#f5f5f5">7</text>
      <rect class="n" x="54" y="488" width="436" height="56" rx="4"/>
      <text class="t name" x="66" y="507" text-anchor="start">L1 cache: exact</text>
      <text class="t sub" x="66" y="521.0" text-anchor="start">key = tool + args + scope + chat + policy</text>
      <text class="t sub" x="66" y="532.6" text-anchor="start">generation; a role change bumps the generation</text>
      <text class="t al" x="480" y="508" text-anchor="end">hit → return</text>
      <path class="arw" d="M33 517 V550"/>
      <circle cx="33" cy="572" r="11" fill="#2d3142"/>
      <text class="t" x="33" y="576" text-anchor="middle" font-size="10" fill="#f5f5f5">8</text>
      <rect class="n" x="54" y="554" width="436" height="56" rx="4"/>
      <text class="t name" x="66" y="573" text-anchor="start">L3 cache: single-flight</text>
      <text class="t sub" x="66" y="587.0" text-anchor="start">identical calls in flight share one upstream call;</text>
      <text class="t sub" x="66" y="598.6" text-anchor="start">the rest wait for that answer</text>
      <text class="t al" x="480" y="574" text-anchor="end">coalesced</text>
      <path class="arw" d="M33 583 V616"/>
      <circle cx="33" cy="638" r="11" fill="#2d3142"/>
      <text class="t" x="33" y="642" text-anchor="middle" font-size="10" fill="#f5f5f5">9</text>
      <rect class="n" x="54" y="620" width="436" height="56" rx="4"/>
      <text class="t name" x="66" y="639" text-anchor="start">upstream MCP call</text>
      <text class="t sub" x="66" y="653.0" text-anchor="start">one connection per service; the service holds no</text>
      <text class="t sub" x="66" y="664.6" text-anchor="start">policy and no identity</text>
      <text class="t al" x="480" y="640" text-anchor="end">timeout</text>
      <path class="arw" d="M33 649 V682"/>
      <circle cx="33" cy="704" r="11" fill="#2d3142"/>
      <text class="t" x="33" y="708" text-anchor="middle" font-size="10" fill="#f5f5f5">10</text>
      <rect class="n" x="54" y="686" width="436" height="56" rx="4"/>
      <text class="t name" x="66" y="705" text-anchor="start">audit, then answer</text>
      <text class="t sub" x="66" y="719.0" text-anchor="start">the decision is written before the answer leaves;</text>
      <text class="t sub" x="66" y="730.6" text-anchor="start">the counter is charged once</text>
      <text class="t al" x="480" y="706" text-anchor="end">audit</text>
      <text class="t m" x="530" y="74" text-anchor="start">WHAT THE MODEL MAY SEE — first failing gate wins</text>
      <rect class="n" x="530" y="92" width="290" height="46" rx="4"/>
      <text class="t sub" x="542" y="109" text-anchor="start">the tool has no policy facts</text>
      <text class="t m" x="542" y="123" text-anchor="start">no_policy_facts</text>
      <rect class="n" x="530" y="148" width="290" height="46" rx="4"/>
      <text class="t sub" x="542" y="165" text-anchor="start">it was marked destructive</text>
      <text class="t m" x="542" y="179" text-anchor="start">destructive</text>
      <rect class="n" x="530" y="204" width="290" height="46" rx="4"/>
      <text class="t sub" x="542" y="221" text-anchor="start">this chat type does not list it</text>
      <text class="t m" x="542" y="235" text-anchor="start">not_in_chat</text>
      <rect class="n" x="530" y="260" width="290" height="46" rx="4"/>
      <text class="t sub" x="542" y="277" text-anchor="start">the caller's role does not grant it</text>
      <text class="t m" x="542" y="291" text-anchor="start">not_in_role</text>
      <rect class="n" x="530" y="316" width="290" height="46" rx="4"/>
      <text class="t sub" x="542" y="333" text-anchor="start">no running service advertises it</text>
      <text class="t m" x="542" y="347" text-anchor="start">service_not_advertising</text>
      <rect class="n" x="530" y="372" width="290" height="46" rx="4"/>
      <text class="t sub" x="542" y="389" text-anchor="start">no consent grant covers its scope</text>
      <text class="t m" x="542" y="403" text-anchor="start">no_consent</text>
      <rect class="n" x="530" y="428" width="290" height="46" rx="4"/>
      <text class="t sub" x="542" y="445" text-anchor="start">the answer may not be delivered here</text>
      <text class="t m" x="542" y="459" text-anchor="start">personal_data_not_here</text>
      <text class="t sub" x="530" y="490" text-anchor="start">effective = chat allowlist ∩ role ∩ consent ∩</text>
      <text class="t sub" x="530" y="502" text-anchor="start">advertised ∩ ¬destructive. "*" means as much as the</text>
      <text class="t sub" x="530" y="514" text-anchor="start">chat already allows, never more.</text>
      <text class="t m" x="850" y="74" text-anchor="start">THE SECOND DOOR — /v1/chat/completions</text>
      <rect class="n" x="850" y="92" width="412" height="54" rx="4"/>
      <text class="t name" x="864" y="113" text-anchor="start">token</text>
      <text class="t sub" x="864" y="128" text-anchor="start">the harness holds one credential; the provider key never leaves the</text>
      <text class="t sub" x="864" y="140" text-anchor="start">server</text>
      <path class="arw" d="M1056.0 146 V154"/>
      <rect class="n" x="850" y="162" width="412" height="54" rx="4"/>
      <text class="t name" x="864" y="183" text-anchor="start">user</text>
      <text class="t sub" x="864" y="198" text-anchor="start">token → user → policy. Nothing in the body decides who is spending.</text>
      <path class="arw" d="M1056.0 216 V224"/>
      <rect class="n" x="850" y="232" width="412" height="54" rx="4"/>
      <text class="t name" x="864" y="253" text-anchor="start">model whitelist</text>
      <text class="t sub" x="864" y="268" text-anchor="start">a model id policy does not name is refused before any provider is asked</text>
      <path class="arw" d="M1056.0 286 V294"/>
      <rect class="n" x="850" y="302" width="412" height="54" rx="4"/>
      <text class="t name" x="864" y="323" text-anchor="start">model-mcp</text>
      <text class="t sub" x="864" y="338" text-anchor="start">one turn in, one turn out; SSE is one content delta, and the docs say</text>
      <text class="t sub" x="864" y="350" text-anchor="start">why</text>
      <path class="arw" d="M1056.0 356 V364"/>
      <rect class="n" x="850" y="372" width="412" height="54" rx="4"/>
      <text class="t name" x="864" y="393" text-anchor="start">provider</text>
      <text class="t sub" x="864" y="408" text-anchor="start">reached only by the model service, with the key it was given at boot</text>
      <path class="arw" d="M1056.0 434 V450"/>
      <rect class="grp" x="850" y="452" width="412" height="52" rx="4"/>
      <text class="t name" x="864" y="474" text-anchor="start">fail-closed</text>
      <text class="t sub" x="864" y="490" text-anchor="start">a policy that cannot be loaded is a 503, not a quiet default: a policy</text>
      <text class="t sub" x="864" y="502" text-anchor="start">that silently degrades is worse than one that refuses to start.</text>
    </svg>
  </figure>
  <figcaption><b>Ten stages, one order, no shortcuts.</b> Authorisation happens before spending, spending happens before calling, and the audit write happens before the answer leaves. The right column is the same decision seen from the other side: why a tool is not in the list the model received. <i>Not shown:</i> the long-running job poll path (/v1/jobs/{id}) and the metrics endpoint.</figcaption>
</main>
</body>
