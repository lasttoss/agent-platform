<style>
  :root{
    --paper:#f5f5f5; --paper-2:#ececec;
    --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399;
    --rule:rgba(45,49,66,0.12); --rule-solid:#bfc0c0;

  }
  *{box-sizing:border-box}
  body{margin:0;padding:34px 30px 38px;background:var(--paper);color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

  .wrap{max-width:1340px;margin:0 auto}
  h1{font-size:21px;font-weight:600;letter-spacing:-0.01em;margin:0 0 4px}
  .lead{color:var(--muted);font-size:13px;margin:0 0 20px;max-width:88ch}
  .canvas{background:var(--paper-2);border:1px solid var(--rule);border-radius:4px;
    padding:10px 12px 6px;overflow:auto}
  svg{display:block;width:100%;height:auto;min-width:1000px}
  .n{fill:var(--paper);stroke:var(--rule-solid);stroke-width:1}
  .nf{fill:var(--paper);stroke:var(--muted);stroke-width:1}
  .focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.6}
  .grp{fill:none;stroke:var(--rule-solid);stroke-width:1;stroke-dasharray:4 4}
  .t{font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--ink)}
  .name{font-size:13px;font-weight:600}
  .sub{font-size:10.5px;fill:var(--muted)}
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;fill:var(--soft);letter-spacing:.04em}
  .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;fill:var(--soft);letter-spacing:.16em}
  .al{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8.5px;fill:var(--muted)}
  .arw{stroke:var(--muted);stroke-width:1.4;fill:none}
  .arw-link{stroke:var(--link);stroke-width:1.4;fill:none}
  .arw-dash{stroke:var(--soft);stroke-width:1.2;fill:none;stroke-dasharray:5 4}

  figcaption b{color:var(--ink);font-weight:600}

<body>
<main class="wrap">
  <h1>Three cache layers, three prices</h1>
  <p class="lead">A cache is a promise about how stale an answer may be. Each layer below makes a different promise, and each one has a failure it can cause.</p>

  <figure class="canvas">
    <svg viewBox="0 0 1280 570" role="img" aria-labelledby="fTitle fDesc"
         xmlns="http://www.w3.org/2000/svg">
      <title id="fTitle">agent-platform: cache layers</title>
      <desc id="fDesc">A request passes an exact cache keyed by tool, arguments, scope, chat and policy generation, then a semantic cache that requires the same tool and scope, then single-flight coalescing, then one upstream call. A panel lists the measured numbers behind the picture.</desc>

      <defs>
        <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d75"/></marker>
        <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e5aa8"/></marker>
        <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a8399"/></marker>
      </defs>
      <rect class="n" x="136" y="96" width="203" height="74" rx="4"/>
      <text class="t name" x="150" y="122" text-anchor="start">request</text>
      <text class="t sub" x="150" y="138" text-anchor="start">one tool call, one scope</text>
      <path class="arw" d="M339 133 H363" marker-end="url(#a1)"/>
      <rect class="focal" x="365" y="96" width="203" height="74" rx="4"/>
      <text class="t name" x="379" y="122" text-anchor="start">L1 exact</text>
      <text class="t sub" x="379" y="138" text-anchor="start">tool + args + scope + chat +</text>
      <text class="t sub" x="379" y="150" text-anchor="start">policy generation</text>
      <path class="arw" d="M568 133 H592" marker-end="url(#a1)"/>
      <rect class="focal" x="594" y="96" width="203" height="74" rx="4"/>
      <text class="t name" x="608" y="122" text-anchor="start">L2 semantic</text>
      <text class="t sub" x="608" y="138" text-anchor="start">same tool AND same scope, or</text>
      <text class="t sub" x="608" y="150" text-anchor="start">nothing</text>
      <path class="arw" d="M797 133 H821" marker-end="url(#a1)"/>
      <rect class="focal" x="823" y="96" width="203" height="74" rx="4"/>
      <text class="t name" x="837" y="122" text-anchor="start">L3 prefix</text>
      <text class="t sub" x="837" y="138" text-anchor="start">byte-identical prefix at the</text>
      <text class="t sub" x="837" y="150" text-anchor="start">provider</text>
      <path class="arw" d="M1026 133 H1050" marker-end="url(#a1)"/>
      <rect class="n" x="1052" y="96" width="203" height="74" rx="4"/>
      <text class="t name" x="1066" y="122" text-anchor="start">upstream</text>
      <text class="t sub" x="1066" y="138" text-anchor="start">the service, then the provider</text>
      <text class="al" x="1039.0" y="84" text-anchor="middle">single-flight</text>
      <rect class="grp" x="365" y="188" width="203" height="46" rx="3"/>
      <text class="t sub" x="375" y="204.0" text-anchor="start">a whole upstream call</text>
      <rect class="grp" x="594" y="188" width="203" height="46" rx="3"/>
      <text class="t sub" x="604" y="204.0" text-anchor="start">the same call with different words</text>
      <rect class="grp" x="823" y="188" width="203" height="46" rx="3"/>
      <text class="t sub" x="833" y="204.0" text-anchor="start">the static prefix, billed once and</text>
      <text class="t sub" x="833" y="215.4" text-anchor="start">then cached by the provider</text>
      <rect class="grp" x="1052" y="188" width="203" height="46" rx="3"/>
      <text class="t sub" x="1062" y="204.0" text-anchor="start">nothing — this is the cost</text>
      <rect class="grp" x="365" y="240" width="203" height="46" rx="3"/>
      <text class="t sub" x="375" y="256.0" text-anchor="start">a stale answer until the TTL ends;</text>
      <text class="t sub" x="375" y="267.4" text-anchor="start">0 means never cache</text>
      <rect class="grp" x="594" y="240" width="203" height="46" rx="3"/>
      <text class="t sub" x="604" y="256.0" text-anchor="start">a similar question is not the same</text>
      <text class="t sub" x="604" y="267.4" text-anchor="start">question — hence the tool in the</text>
      <text class="t sub" x="604" y="278.8" text-anchor="start">key</text>
      <rect class="grp" x="823" y="240" width="203" height="46" rx="3"/>
      <text class="t sub" x="833" y="256.0" text-anchor="start">nothing semantic: the provider</text>
      <text class="t sub" x="833" y="267.4" text-anchor="start">either has the prefix or it does</text>
      <text class="t sub" x="833" y="278.8" text-anchor="start">not</text>
      <rect class="grp" x="1052" y="240" width="203" height="46" rx="3"/>
      <text class="t sub" x="1062" y="256.0" text-anchor="start">latency and money leave the</text>
      <text class="t sub" x="1062" y="267.4" text-anchor="start">building here</text>
      <rect class="grp" x="365" y="292" width="203" height="46" rx="3"/>
      <text class="t sub" x="375" y="308.0" text-anchor="start">TTL in tools.json, per tool</text>
      <rect class="grp" x="594" y="292" width="203" height="46" rx="3"/>
      <text class="t sub" x="604" y="308.0" text-anchor="start">TTL + cosine 0.93 + scope + tool</text>
      <rect class="grp" x="823" y="292" width="203" height="46" rx="3"/>
      <text class="t sub" x="833" y="308.0" text-anchor="start">byte-identical prefix in the same</text>
      <text class="t sub" x="833" y="319.4" text-anchor="start">policy version</text>
      <rect class="grp" x="1052" y="292" width="203" height="46" rx="3"/>
      <text class="t sub" x="1062" y="308.0" text-anchor="start">timeout, then a labelled failure</text>
      <text class="t m" x="24" y="206" text-anchor="start">what it saves</text>
      <text class="t m" x="24" y="258" text-anchor="start">what it can get wrong</text>
      <text class="t m" x="24" y="310" text-anchor="start">how it is bounded</text>
      <text class="t sub" x="146" y="204.0" text-anchor="start">one call, always — this is the cost</text>
      <rect class="grp" x="24" y="374" width="1232" height="178" rx="4"/>
      <text class="t m" x="40" y="398" text-anchor="start">MEASURED — the numbers this picture is drawn from</text>
      <text class="t sub" x="40" y="420" text-anchor="start">40 identical calls at once</text>
      <text class="t m" x="40" y="434" text-anchor="start">10 upstream calls · 30 coalesced</text>
      <text class="t sub" x="40" y="446" text-anchor="start">cache_misses counts only the leader; coalesced is reported separately</text>
      <text class="t sub" x="650" y="420" text-anchor="start">200 concurrent, no cache</text>
      <text class="t m" x="650" y="434" text-anchor="start">p50 31.6 ms → 42.8 ms at 3,924 rps</text>
      <text class="t sub" x="650" y="446" text-anchor="start">load test on the compose stack; the gateway, not the provider, is the cost</text>
      <text class="t sub" x="40" y="484" text-anchor="start">46.4M rows in ClickHouse</text>
      <text class="t m" x="40" y="498" text-anchor="start">raw 43–50 ms · aggregate view 192 rows 1.7–2.3 ms</text>
      <text class="t sub" x="40" y="510" text-anchor="start">an aggregate view is a cache with a schema; the numbers are one machine</text>
      <text class="t sub" x="650" y="484" text-anchor="start">semantic hit without the tool</text>
      <text class="t m" x="650" y="498" text-anchor="start">wrong answer, reported as a hit</text>
      <text class="t sub" x="650" y="510" text-anchor="start">that is why the key carries the tool, not just the sentence</text>
    </svg>
  </figure>
  <figcaption><b>Three caches, three different mistakes.</b> The exact cache can be stale, the semantic cache can be wrong, and single-flight can be neither — it only removes duplicates of the same call. The generation in the key is what makes a role change take effect immediately instead of after a TTL. <i>What this does not prove:</i> the semantic threshold was tuned on one set of Vietnamese sentences, and a hit rate is not an accuracy number.</figcaption>
</main>
</body>
